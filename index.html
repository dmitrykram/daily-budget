
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f2">  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daily Budget">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Daily Budget</title>
  <style>
    :root {
      --bg: #f5f6f2;
      --card: #ffffff;
      --text: #20251f;
      --muted: #858b81;
      --green: #26734d;
      --green-bg: #e4f1e7;
      --red: #c64e46;
      --border: #e9ebe5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: max(26px, env(safe-area-inset-top)) 20px
        max(32px, env(safe-area-inset-bottom));
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -0.7px;
    }

    .date-label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 15px;
      background: var(--green-bg);
      color: var(--green);
      font-size: 20px;
    }

    .eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      font-weight: 650;
    }

    .hero {
      background: #203f30;
      color: white;
      padding: 26px 24px 22px;
      border-radius: 26px;
      margin-bottom: 16px;
      box-shadow: 0 12px 30px rgba(32, 63, 48, .09);
    }

    .hero .eyebrow { color: #c0d4c5; }

    .daily-limit {
      font-size: clamp(48px, 13vw, 64px);
      font-weight: 750;
      letter-spacing: -3px;
      margin: 12px 0 2px;
      line-height: 1.1;
    }

    .currency {
      font-size: 20px;
      letter-spacing: 0;
      font-weight: 500;
    }

    .hero-caption {
      color: #c0d4c5;
      font-size: 13px;
      margin-top: 8px;
    }

    .progress-track {
      height: 6px;
      background: rgba(255,255,255,.18);
      border-radius: 20px;
      overflow: hidden;
      margin-top: 25px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #b4e1b9;
      border-radius: inherit;
      transition: width .3s ease;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      font-size: 11px;
      color: #c0d4c5;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 26px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 16px;
      min-width: 0;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
    }

    .stat-value {
      font-size: clamp(20px, 5vw, 25px);
      font-weight: 720;
      letter-spacing: -1px;
      overflow-wrap: anywhere;
    }

    .stat-note {
      color: var(--muted);
      font-size: 11px;
      margin-top: 7px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .days {
      font-size: 12px;
      color: var(--muted);
    }

    .transactions {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }

    .transaction {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }

    .transaction:last-child { border-bottom: 0; }

    .tx-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-size: 18px;
    }

    .tx-main { flex: 1; min-width: 0; }

    .tx-name {
      font-weight: 650;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .tx-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 5px;
    }

    .tx-amount {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tx-amount.expense { color: var(--red); }
    .tx-amount.income { color: var(--green); }

    .empty {
      text-align: center;
      padding: 30px 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .add-button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 17px;
      padding: 17px;
      background: var(--green);
      color: white;
      font-weight: 700;
      font-size: 15px;
      margin-top: 20px;
      cursor: pointer;
    }

    .add-button:active { opacity: .85; }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(20, 30, 23, .45);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 10;
    }

    .modal.open { display: flex; }

    .modal-content {
      width: 100%;
      max-width: 520px;
      background: var(--bg);
      padding: 24px 20px max(24px, env(safe-area-inset-bottom));
      border-radius: 26px 26px 0 0;
      max-height: 90dvh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 750;
      margin-bottom: 22px;
    }

    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 18px;
    }

    .type-button {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 13px;
      padding: 13px;
      cursor: pointer;
    }

    .type-button.selected {
      background: var(--green-bg);
      border-color: var(--green);
      color: var(--green);
      font-weight: 700;
    }

    .field { margin-bottom: 15px; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field input, .field select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 14px;
      background: white;
      color: var(--text);
      outline: none;
    }

    .field input:focus, .field select:focus {
      border-color: var(--green);
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 14px;
      padding: 15px;
      cursor: pointer;
    }

    .modal-actions .add-button { margin: 0; }

    .status {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      margin-top: 14px;
      min-height: 18px;
    }

    @media (min-width: 600px) {
      body { padding: 20px 0; }
      .app {
        background: var(--bg);
        border-radius: 28px;
      }
      .modal { align-items: center; }
      .modal-content { border-radius: 26px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <div class="brand">Daily Budget<span style="color:#26734d">.</span></div>
        <div class="date-label" id="todayLabel">Загружаем дату…</div>
      </div>
      <div class="avatar">↗</div>
    </header>

    <section class="hero">
      <div class="eyebrow">Твой лимит на день</div>
      <div class="daily-limit">
        <span id="dailyLimit">—</span>
        <span class="currency" id="currencyHero">GEL</span>
      </div>
      <div class="hero-caption" id="dailyCaption">Загружаем данные бюджета…</div>

      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-labels">
        <span id="progressLeft">Накопления</span>
        <span id="progressRight">Цель</span>
      </div>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">Текущий баланс</div>
        <div class="stat-value" id="balance">—</div>
        <div class="stat-note">С учётом операций</div>
      </div>
      <div class="stat">
        <div class="stat-label">Цель накоплений</div>
        <div class="stat-value" id="goal">—</div>
        <div class="stat-note" id="goalNote">К целевой дате</div>
      </div>
      <div class="stat">
        <div class="stat-label">Можно потратить</div>
        <div class="stat-value" id="available">—</div>
        <div class="stat-note">Сверх цели накоплений</div>
      </div>
      <div class="stat">
        <div class="stat-label">Осталось дней</div>
        <div class="stat-value" id="remainingDays">—</div>
        <div class="stat-note" id="targetDateNote">До целевой даты</div>
      </div>
    </section>

    <section>
      <div class="section-head">
        <div class="section-title">Последние операции</div>
        <div class="days" id="transactionCount"></div>
      </div>
      <div class="transactions" id="transactions">
        <div class="empty">Загружаем операции…</div>
      </div>
    </section>

    <button class="add-button" id="openModal">＋ Добавить операцию</button>
    <div class="status" id="status"></div>
  </main>

  <div class="modal" id="modal">
    <form class="modal-content" id="transactionForm">
      <div class="modal-title">Новая операция</div>

      <div class="type-toggle">
        <button type="button" class="type-button selected" data-type="expense">− Расход</button>
        <button type="button" class="type-button" data-type="income">＋ Доход</button>
      </div>

      <div class="field">
        <label for="amount">Сумма</label>
        <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
      </div>

      <div class="field">
        <label for="date">Дата</label>
        <input id="date" name="date" type="date" required>
      </div>

      <div class="field">
        <label for="category">Категория</label>
        <select id="category" name="category">
          <option value="Food">Еда</option>
          <option value="Transport">Транспорт</option>
          <option value="Shopping">Покупки</option>
          <option value="Bills">Счета</option>
          <option value="Entertainment">Развлечения</option>
          <option value="Health">Здоровье</option>
          <option value="Salary">Зарплата</option>
          <option value="Other">Другое</option>
        </select>
      </div>

      <div class="field">
        <label for="comment">Комментарий (необязательно)</label>
        <input id="comment" name="comment" type="text" placeholder="Например, обед">
      </div>

      <div class="modal-actions">
        <button type="button" class="secondary-button" id="closeModal">Отмена</button>
        <button type="submit" class="add-button" id="saveButton">Сохранить</button>
      </div>
      <div class="status" id="formStatus"></div>
    </form>
  </div>

  <script>
    /*
      На следующем этапе сюда добавим URL твоего Google Apps Script.
      Пока экран использует демонстрационные данные.
    */
    const API_URL = 'https://script.google.com/macros/s/AKfycbztQ1fuOaxQQoy_Q7y3L8N7bLk4OJ0ZJdEhL2Gi_a9oRClOoMvvY1-wOM-qYppF__LG3Q/exec';

    const $ = id => document.getElementById(id);

    let summary = null;
    let transactions = [];
    let transactionType = 'expense';

    const demoSummary = {
      today: '2026-10-12',
      targetDate: '2026-11-05',
      currency: 'GEL',
      balance: 2500,
      savingsGoal: 1500,
      availableBudget: 1000,
      remainingDays: 25,
      dailyLimit: 40
    };

    function money(value) {
      return new Intl.NumberFormat('en-US', {
        maximumFractionDigits: 2,
        minimumFractionDigits: 0
      }).format(value);
    }

    function formatDate(value) {
      if (!value) return '';
      const parts = value.split('-');
      if (parts.length !== 3) return value;
      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function renderSummary(data) {
      summary = data;
      const currency = data.currency || 'GEL';

      $('todayLabel').textContent = formatDate(data.today);
      $('dailyLimit').textContent = money(data.dailyLimit);
      $('currencyHero').textContent = currency;
      $('dailyCaption').textContent =
        data.remainingDays > 0
          ? `Ещё ${data.remainingDays} дн. до цели накоплений`
          : 'Целевая дата наступила';

      $('balance').textContent = `${money(data.balance)} ${currency}`;
      $('goal').textContent = `${money(data.savingsGoal)} ${currency}`;
      $('available').textContent = `${money(data.availableBudget)} ${currency}`;
      $('remainingDays').textContent = data.remainingDays;
      $('targetDateNote').textContent = `До ${formatDate(data.targetDate)}`;

      const goalProgress = data.balance > 0
        ? Math.min(100, Math.max(0, data.savingsGoal / data.balance * 100))
        : 0;

      $('progressFill').style.width = `${goalProgress}%`;
      $('progressLeft').textContent = `Цель: ${money(data.savingsGoal)} ${currency}`;
      $('progressRight').textContent = `Баланс: ${money(data.balance)} ${currency}`;
    }

    function renderTransactions(items) {
      transactions = items || [];
      $('transactionCount').textContent = `${transactions.length} шт.`;

      if (!transactions.length) {
        $('transactions').innerHTML =
          '<div class="empty">Пока нет операций.<br>Добавь первый расход или доход.</div>';
        return;
      }

      $('transactions').innerHTML = transactions.slice(0, 10).map(tx => {
        const isIncome = tx.type === 'income';
        const icon = isIncome ? '↙' : '↗';
        const sign = isIncome ? '+' : '−';
        const category = tx.category || 'Другое';
        const title = tx.comment || category;

        return `
          <div class="transaction">
            <div class="tx-icon">${icon}</div>
            <div class="tx-main">
              <div class="tx-name">${escapeHtml(title)}</div>
              <div class="tx-meta">${escapeHtml(category)} · ${formatDate(tx.date)}</div>
            </div>
            <div class="tx-amount ${isIncome ? 'income' : 'expense'}">
              ${sign}${money(tx.amount)} ${escapeHtml(summary?.currency || 'GEL')}
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    async function loadData() {
      if (!API_URL) {
        renderSummary(demoSummary);
        renderTransactions([]);
        $('status').textContent =
          'Демонстрационный режим — подключим Google Sheets на следующем шаге.';
        return;
      }

      try {
        const [summaryResponse, transactionsResponse] = await Promise.all([
          fetch(`${API_URL}?action=summary`),
          fetch(`${API_URL}?action=transactions`)
        ]);

        const summaryResult = await summaryResponse.json();
        const transactionsResult = await transactionsResponse.json();

        if (!summaryResult.success) {
          throw new Error(summaryResult.error || 'Не удалось загрузить бюджет.');
        }

        if (!transactionsResult.success) {
          throw new Error(transactionsResult.error || 'Не удалось загрузить операции.');
        }

        renderSummary(summaryResult.data);
        renderTransactions(transactionsResult.data);
        $('status').textContent = 'Данные синхронизированы.';
      } catch (error) {
        $('status').textContent =
          'Не удалось подключиться к API. Проверим настройки подключения.';
        console.error(error);
      }
    }

    function openModal() {
      $('modal').classList.add('open');
      $('date').value = summary?.today || new Date().toISOString().slice(0, 10);
    }

    function closeModal() {
      $('modal').classList.remove('open');
      $('formStatus').textContent = '';
      $('transactionForm').reset();
      setType('expense');
    }

    function setType(type) {
      transactionType = type;
      document.querySelectorAll('.type-button').forEach(button => {
        button.classList.toggle('selected', button.dataset.type === type);
      });
    }

    $('openModal').addEventListener('click', openModal);
    $('closeModal').addEventListener('click', closeModal);

    $('modal').addEventListener('click', event => {
      if (event.target === $('modal')) closeModal();
    });

    document.querySelectorAll('.type-button').forEach(button => {
      button.addEventListener('click', () => setType(button.dataset.type));
    });

    $('transactionForm').addEventListener('submit', async event => {
      event.preventDefault();

      if (!API_URL) {
        $('formStatus').textContent =
          'Сохранение пока отключено. Сначала подключим Google Sheets.';
        return;
      }

      const amount = Number($('amount').value);

      if (!Number.isFinite(amount) || amount <= 0) {
        $('formStatus').textContent = 'Укажи сумму больше нуля.';
        return;
      }

      const payload = {
        action: 'addTransaction',
        date: $('date').value,
        type: transactionType,
        amount,
        category: $('category').value,
        comment: $('comment').value.trim()
      };

      $('saveButton').disabled = true;
      $('saveButton').textContent = 'Сохраняем…';
      $('formStatus').textContent = '';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error || 'Не удалось сохранить операцию.');
        }

        closeModal();
        await loadData();
      } catch (error) {
        $('formStatus').textContent =
          error.message || 'Ошибка сохранения. Попробуй ещё раз.';
      } finally {
        $('saveButton').disabled = false;
        $('saveButton').textContent = 'Сохранить';
      }
    });

    loadData();
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(console.error);
  });
}
  </script>
</body>
</html>
